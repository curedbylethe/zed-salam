name = "Salam"
grammar = "salam"
path_suffixes = ["salam"]
line_comments = ["// "]
block_comment = ["/*", "*/"]
tab_size = 4
hard_tabs = false
autoclose_before = ";:.,=}])>`"
collapsed_placeholder = "/* ... */"

# Salam blocks open with `:` and close with `end` / `پایان`. Zed's tree-sitter
# indent captures do not fit that shape (the closing keyword is part of the
# parent node), so indentation is driven by these line patterns, which also
# keep working while the block is still being typed.
increase_indent_pattern = ":\\s*(//.*)?$"
decrease_indent_pattern = "^\\s*(end|پایان|else|وگرنه)\\b"

brackets = [
    { start = "{", end = "}", close = true, newline = true },
    { start = "[", end = "]", close = true, newline = true },
    { start = "(", end = ")", close = true, newline = true },
    { start = "\"", end = "\"", close = true, newline = false, not_in = ["string", "comment"] },
    { start = "'", end = "'", close = true, newline = false, not_in = ["string", "comment"] },
    { start = "`", end = "`", close = true, newline = false, not_in = ["string", "comment"] },
    { start = "/*", end = "*/", close = true, newline = false, not_in = ["string"] },
]
